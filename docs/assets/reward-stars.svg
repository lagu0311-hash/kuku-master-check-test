<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="絵本風のごほうびイラスト"><defs><linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#797fc1"/><stop offset="1" stop-color="#d8c9e9"/></linearGradient></defs><style>
