<style>
  .kitty {transform-box:fill-box;transform-origin:50% 85%;animation:kitty-bob 3s ease-in-out infinite}
  .float {transform-box:fill-box;transform-origin:center;animation:floaty 4s ease-in-out infinite}
  .float2 {transform-box:fill-box;transform-origin:center;animation:floaty 5.3s ease-in-out -2s infinite}
  .sway {transform-box:fill-box;transform-origin:bottom center;animation:sway 3s ease-in-out infinite alternate}
  .twinkle {animation:twinkle 2.5s ease-in-out infinite alternate}
  .twinkle2 {animation:twinkle 3.5s ease-in-out -1.2s infinite alternate}
  @keyframes kitty-bob {0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-15px) rotate(-2deg)}}
  @keyframes floaty {0%,100%{transform:translateY(0)}50%{transform:translateY(-21px)}}
  @keyframes sway {0%{transform:rotate(-5deg)}100%{transform:rotate(6deg)}}
  @keyframes twinkle {0%{opacity:.4;transform:scale(.85)}100%{opacity:1;transform:scale(1.14)}}
  @media (prefers-reduced-motion:reduce) {* {animation:none!important}}
</style><g class="twinkle"><path d="M120 365l11 18 21 5-21 5-11 19-10-19-20-5 20-5z" fill="#fff7c9"/></g><g class="twinkle2"><path d="M665 155l10 16 17 4-17 4-10 17-10-17-17-4 17-4z" fill="#ffe6b7"/></g><!-- class="picnic-star" --></svg>
